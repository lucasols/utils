packages:
  - packages/*

allowBuilds:
  esbuild: true

catalog:
  '@ls-stack/fast-lint': 0.7.0
  '@types/node': ^22.10.9
  '@vitest/ui': ^3.0.4
  dequal: ^2.0.3
  evtmitter: ^1.1.1
  oxfmt: 0.74.0
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2004
  mitata: ^1.0.32
  t-result: ^0.6.1
  tsm: ^2.3.0
  tsdown: ^0.23.0
  typedoc: ^0.28.20
  typedoc-plugin-markdown: ^4.6.3
  typedoc-plugin-missing-exports: ^4.0.0
  typedoc-vitepress-theme: ^1.1.2
  typescript: ^7.0.2
  vite: ^6.0.11
  vitest: ^3.0.4

minimumReleaseAgeExclude:
  - '@evtmitter/react@0.1.2'
  - evtmitter@1.1.1
  - '@ls-stack/pkg-manager@0.12.0'
  - '@ls-stack/fast-lint@0.7.0'

onlyBuiltDependencies:
  - esbuild
